<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,5 L0,10 Z" fill="#2b2b2b"/>
    </marker>
    <marker id="ahm" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,5 L0,10 Z" fill="#6e6e6e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="560" fill="#ffffff"/>

  <!-- ===================== INPUTS PANEL ===================== -->
  <text x="170" y="46" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">INPUTS, typed by origin</text>
  <rect x="20" y="60" width="300" height="430" rx="10" fill="none" stroke="#a9a9a9" stroke-width="1.2" stroke-dasharray="5,4"/>

  <!-- chip: Measured -->
  <rect x="36" y="76" width="268" height="80" rx="9" fill="#6e6e6e" stroke="#4f4f4f" stroke-width="1.2"/>
  <text x="170" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Measured</text>
  <text x="170" y="130" text-anchor="middle" font-size="13" fill="#ffffff">Tg, Tl, D*</text>

  <!-- chip: Published DFT -->
  <rect x="36" y="176" width="268" height="80" rx="9" fill="#a9a9a9" stroke="#7d7d7d" stroke-width="1.2"/>
  <text x="170" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f1f1f">Published DFT</text>
  <text x="170" y="230" text-anchor="middle" font-size="13" fill="#1f1f1f">B0, Hf  (Du et al.)</text>

  <!-- chip: Declared model -->
  <rect x="36" y="276" width="268" height="80" rx="9" fill="#e8e8e8" stroke="#b3b3b3" stroke-width="1.2"/>
  <text x="170" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">Declared model</text>
  <text x="170" y="330" text-anchor="middle" font-size="13" fill="#2b2b2b">soft1, soft2, &#948;E</text>

  <!-- chip: Standard -->
  <rect x="36" y="376" width="268" height="80" rx="9" fill="#e8e8e8" stroke="#b3b3b3" stroke-width="1.2"/>
  <text x="170" y="406" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">Standard</text>
  <text x="170" y="430" text-anchor="middle" font-size="13" fill="#2b2b2b">&#955;, &#951;0, x</text>

  <!-- ===================== ENGINE STAGES ===================== -->
  <!-- Crystalline reference -->
  <rect x="370" y="90" width="252" height="100" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.6"/>
  <text x="496" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">Crystalline reference</text>
  <text x="496" y="144" text-anchor="middle" font-size="13" fill="#2b2b2b">Debye Gr&#252;neisen</text>
  <text x="496" y="167" text-anchor="middle" font-size="13" fill="#2b2b2b" font-style="italic">Gcryst(T)</text>

  <!-- Supercooled liquid -->
  <rect x="370" y="300" width="252" height="100" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.6"/>
  <text x="496" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">Supercooled liquid</text>
  <text x="496" y="354" text-anchor="middle" font-size="13" fill="#2b2b2b">Zentropy, two configurations</text>
  <text x="496" y="377" text-anchor="middle" font-size="13" fill="#2b2b2b" font-style="italic">Gliq(T)</text>

  <!-- Driving force node -->
  <rect x="680" y="195" width="190" height="100" rx="10" fill="#f1f1f1" stroke="#2b2b2b" stroke-width="2"/>
  <text x="775" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">Driving force</text>
  <text x="775" y="258" text-anchor="middle" font-size="14" fill="#2b2b2b">&#916;G = Gliq &#8722; Gcryst</text>

  <!-- Nucleation -->
  <rect x="928" y="150" width="232" height="110" rx="10" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.6"/>
  <text x="1044" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">Classical nucleation</text>
  <text x="1044" y="207" text-anchor="middle" font-size="13" fill="#2b2b2b">I(T), U(T)</text>
  <text x="1044" y="230" text-anchor="middle" font-size="13" fill="#2b2b2b">&#8594; TTT diagram</text>

  <!-- Outputs -->
  <text x="1044" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">OUTPUTS</text>
  <rect x="928" y="324" width="232" height="86" rx="9" fill="#e8e8e8" stroke="#7d7d7d" stroke-width="1.2"/>
  <text x="1044" y="356" text-anchor="middle" font-size="13" fill="#1f1f1f">Rc,  critical cooling rate</text>
  <text x="1044" y="380" text-anchor="middle" font-size="13" fill="#1f1f1f">dc,  critical diameter</text>

  <!-- ===================== ARROWS ===================== -->
  <!-- inputs -> crystalline -->
  <line x1="320" y1="170" x2="366" y2="140" stroke="#6e6e6e" stroke-width="1.8" marker-end="url(#ahm)"/>
  <!-- inputs -> liquid -->
  <line x1="320" y1="360" x2="366" y2="350" stroke="#6e6e6e" stroke-width="1.8" marker-end="url(#ahm)"/>
  <!-- liquidus calibration into liquid (the one calibrated knob) -->
  <line x1="430" y1="455" x2="470" y2="404" stroke="#2b2b2b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ah)"/>
  <text x="430" y="480" text-anchor="middle" font-size="12" font-style="italic" fill="#2b2b2b">liquidus calibration</text>
  <text x="430" y="497" text-anchor="middle" font-size="12" font-style="italic" fill="#2b2b2b">&#916;G(Tl) = 0</text>

  <!-- crystalline -> driving force -->
  <line x1="622" y1="150" x2="676" y2="218" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#ah)"/>
  <!-- liquid -> driving force -->
  <line x1="622" y1="340" x2="676" y2="272" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#ah)"/>
  <!-- driving force -> nucleation -->
  <line x1="870" y1="240" x2="924" y2="215" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#ah)"/>
  <!-- measured kinetics into nucleation top -->
  <line x1="1044" y1="120" x2="1044" y2="146" stroke="#6e6e6e" stroke-width="1.5" marker-end="url(#ahm)"/>
  <text x="1044" y="110" text-anchor="middle" font-size="12" font-style="italic" fill="#6e6e6e">D* &#8594; &#951;(T),   &#945;T &#8594; &#963;</text>
  <!-- nucleation -> outputs -->
  <line x1="1044" y1="260" x2="1044" y2="320" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- ===================== SENSITIVITY RIBBON ===================== -->
  <line x1="360" y1="512" x2="1160" y2="512" stroke="#a9a9a9" stroke-width="1"/>
  <text x="760" y="534" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">Sensitivity of the prediction:</text>
  <text x="760" y="553" text-anchor="middle" font-size="12" fill="#2b2b2b">&#945;T  &#8811;  soft2 &gt; soft1  &gt;  D*  &gt;  &#955;  &gt;  &#951;0 &#8776; x &#8776; Vm  &gt;  &#948;E  &#8811;  B0 (DFT, negligible)</text>
</svg>
