# Environment for the Cu-Zr spectrum MD on Sol (GPU): Python 3.11, ASE 3.29.0, mace-torch 0.3.16, torch 2.14.1,
# cuEquivariance 0.12.0. CUDA 12 builds, as the A100 driver may be too old for CUDA 13. Same packages and name as the
# environment built for the 2026-10-24 MD runs, so it is reused if it is still on Sol.
name: mace-md
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy=2.4
  - scipy=1.17
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.14.1+cu126
      - ase==3.29.0
      - mace-torch==0.3.16
      - e3nn==0.4.4
      - matscipy==1.3.0
      - opt_einsum==3.4.0
      - cuequivariance==0.12.0
      - cuequivariance-torch==0.12.0
      - cuequivariance-ops-torch-cu12==0.12.0
